# Coberto's Utilities. Feature settings are changed with commands and saved in
# their own files here (activity.yml, crates.yml, music.yml, prank.yml).

# The vanilla block each special block places (players have no mods, so there
# are no new blocks). Blocks already placed keep theirs.
blocks:
  crate: BARREL
  spooky_crate: CARVED_PUMPKIN
  holiday_crate: SNOW_BLOCK
  music_selector: JUKEBOX
  prank_button: CRIMSON_BUTTON

# Compass Menu: players right-click a compass to get this menu (a form on Bedrock,
# a chest menu on Java). Each button
# runs its command as that player. item is the Java icon (a material name). image
# is the optional Bedrock icon: a Bedrock texture path
# (like textures/items/compass_item) or an https:// link to a picture.
bedrock_menu:
  title: Crobus SMP
  content: Pick something to do.
  buttons:
    - text: What's New
      command: whatsnew
      image: textures/items/book_writable
      item: WRITABLE_BOOK
    - text: Spawn
      command: spawn
      image: textures/items/bed_red
      item: RED_BED
    - text: Home
      command: home
      image: textures/items/door_wood
      item: OAK_DOOR
    - text: Balance
      command: bal
      image: textures/items/gold_ingot
      item: GOLD_INGOT
    - text: Peaceful or Fighter
      command: pvpmenu
      image: textures/items/diamond_sword
      item: DIAMOND_SWORD
    - text: Pick a Class
      command: class
      image: textures/items/nether_star
      item: NETHER_STAR
    - text: Unload into Chests
      command: unload
      image: textures/blocks/chest_front
      item: CHEST
    - text: Dump into Chests
      command: dump
      image: textures/blocks/barrel_side
      item: BARREL
    - text: Chest Sorting
      command: chestsort
      image: textures/items/hopper
      item: HOPPER
    - text: Lumberjack On/Off
      command: lumberjack
      image: textures/items/iron_axe
      item: IRON_AXE
    - text: Hotbar Refill On/Off
      command: refill
      image: textures/blocks/hopper_top
      item: BUNDLE
    - text: Best Tools On/Off
      command: bt
      image: textures/items/diamond_pickaxe
      item: DIAMOND_PICKAXE
    - text: Slots Leaderboard
      command: slotstop
      image: textures/items/emerald
      item: EMERALD
