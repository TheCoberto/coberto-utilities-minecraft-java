name: CobertoUtilities
version: '${version}'
main: com.thecoberto.utilities.CobertoUtilities
api-version: '1.21'
softdepend: [GriefPrevention, Vault, Essentials, floodgate, LuckPerms, SimpleClans, EconomyShopGUI, EconomyShopGUI-Premium]
description: Coberto's Utilities for Paper servers. Classes, Activity Rewards, Loot Crates, the Music Selector, the Odd Button, World Cleanup, /unload, Lumberjack, the Bedrock Menu, and the Kingdom, Market and Leaderboard boards (Discord).
author: TheCoberto
commands:
  class:
    description: Choose your class from a menu
    usage: /class
    permission: cobertoutilities.classes
  setclass:
    description: Set players' class (none removes it)
    usage: /setclass <players> <class|none>
    permission: cobertoutilities.classes.admin
  utilitiesgive:
    description: Give a Crate, Music Selector or Odd Button
    usage: /utilitiesgive <crate|spooky_crate|holiday_crate|music_selector|prank_button> [player] [amount]
    permission: cobertoutilities.admin
  activity:
    description: Turn Activity Rewards on or off, or see the settings
    usage: /activity [true|false]
    permission: cobertoutilities.admin
  activityreward:
    description: Set the Activity Reward
    usage: /activityreward <amount> <minutes>
    permission: cobertoutilities.admin
  activitymessage:
    description: Set the Activity Reward message ({amount}, {player}, {minutes}, & colors)
    usage: /activitymessage <message|reset>
    permission: cobertoutilities.admin
  activitysound:
    description: Set the Activity Reward sound
    usage: /activitysound <sound|none>
    permission: cobertoutilities.admin
  crates:
    description: See and change what loot crates drop
    usage: /crates [crate] [add <item> <weight> [min] [max]|remove <item>|items <least> <most>|reset]
    permission: cobertoutilities.admin
  music:
    description: Music Selector settings
    usage: /music [price|cooldown|maxqueue|autoplay|shuffle|songs|allow|playlist|songprice|stopall]
    permission: cobertoutilities.admin
  musicskip:
    description: Skip the song at the nearest Music Selector
    usage: /musicskip
    permission: cobertoutilities.admin
  cleanup:
    description: Clear hostile mobs, arrows, XP orbs and dropped items in every world
    usage: /cleanup
    permission: cobertoutilities.admin
  prankbutton:
    description: Change an Odd Button (its owner or an operator)
    usage: /prankbutton <x> <y> <z> [setting] [value]
  areatitle:
    description: Titles that show when players walk into an area
    usage: /areatitle <create <name> <radius>|set <name> <title|subtitle|radius|cooldown|here> [value]|remove <name>|test <name>|list>
    permission: cobertoutilities.admin
  unload:
    description: Put your items into nearby chests that already hold the same item
    usage: /unload
    permission: cobertoutilities.unload
  dump:
    description: Empty your inventory into nearby chests (not your hotbar or armor)
    usage: /dump
    permission: cobertoutilities.unload
  lumberjack:
    description: Turn Lumberjack (chop a whole tree at once) on or off
    usage: /lumberjack [on|off]
    aliases: [lj, treefeller]
    permission: cobertoutilities.lumberjack
  kingdomboard:
    description: The Discord Kingdom Board (factions and clans)
    usage: /kingdomboard [status|refresh|repost|reload|webhook <url>]
    permission: cobertoutilities.admin
  market:
    description: The Discord Market Board (shop board, trade feed, shop news)
    usage: /market [status|refresh|note <text>|announce <text>|repost|reload|webhook <url>]
    permission: cobertoutilities.admin
  leaderboard:
    description: The Discord Leaderboard (top players in money, kills, claims, playtime...)
    usage: /leaderboard [status|refresh|repost|reload|webhook <url>]
    permission: cobertoutilities.admin
  servermenu:
    description: Open the Compass Menu without a compass
    usage: /servermenu
    aliases: [smenu]
permissions:
  cobertoutilities.lumberjack:
    description: Use /lumberjack and fell whole trees
    default: true
  cobertoutilities.unload:
    description: Use /unload and /dump
    default: true
  cobertoutilities.admin:
    description: Give special blocks and change Activity Rewards, crates, music and any Odd Button
    default: op
  cobertoutilities.classes:
    description: Pick a class with /class
    default: true
  cobertoutilities.classes.admin:
    description: Use /setclass and change class without waiting
    default: op
